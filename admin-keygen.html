<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IRONPULSE · 管理員續用碼生成器</title>
    <style>
      :root {
        --bg: #F8F5F0;
        --card: #FFFFFF;
        --accent: #C9A96E;
        --accent-soft: rgba(201, 169, 110, 0.12);
        --text: #2C2B28;
        --text2: #7A756D;
        --border: #E5DFD4;
        --danger: #E8A87C;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", "Segoe UI", sans-serif;
        min-height: 100vh;
      }
      .wrap {
        max-width: 560px; margin: 0 auto; padding: 40px 24px 80px;
      }
      h1 {
        font-family: "Bebas Neue", sans-serif;
        font-size: 36px; letter-spacing: 2px; margin: 0 0 4px;
      }
      .sub { font-size: 13px; color: var(--text2); margin-bottom: 32px; }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 1px 3px rgba(44, 43, 40, 0.06);
        margin-bottom: 16px;
      }
      label {
        display: block;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: var(--text2);
        margin-bottom: 8px;
      }
      input, select, textarea {
        width: 100%;
        padding: 12px 14px;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 12px;
        color: var(--text);
        font-size: 14px;
        font-family: inherit;
        outline: none;
        transition: border-color 0.15s;
      }
      input:focus, select:focus, textarea:focus {
        border-color: var(--accent);
      }
      input.mono {
        font-family: ui-monospace, "JetBrains Mono", monospace;
        letter-spacing: 0.5px;
      }
      .row { display: flex; gap: 12px; }
      .row > * { flex: 1; }
      button {
        background: var(--accent);
        color: var(--bg);
        border: none;
        padding: 14px 20px;
        border-radius: 12px;
        font-weight: 700;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 1px;
        cursor: pointer;
        width: 100%;
        transition: filter 0.15s, transform 0.05s;
      }
      button:hover { filter: brightness(1.05); }
      button:active { transform: translateY(1px); }
      button.secondary {
        background: transparent;
        color: var(--accent);
        border: 2px solid var(--accent);
      }
      .muted {
        font-size: 11px; color: var(--text2); line-height: 1.5;
      }
      .result {
        background: var(--accent-soft);
        border: 2px dashed var(--accent);
        border-radius: 12px;
        padding: 16px;
        margin-top: 8px;
        font-family: ui-monospace, monospace;
        font-size: 16px;
        letter-spacing: 1px;
        word-break: break-all;
        color: var(--text);
        user-select: all;
        cursor: pointer;
      }
      .result-label {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: var(--accent);
        margin-bottom: 6px;
      }
      .toast {
        position: fixed;
        bottom: 40px; left: 50%;
        transform: translateX(-50%);
        background: var(--text);
        color: var(--bg);
        padding: 12px 24px;
        border-radius: 12px;
        font-size: 13px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
      }
      .toast.show { opacity: 1; }
      .stages {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 6px;
        margin-top: 8px;
      }
      .stage-chip {
        font-size: 10px;
        padding: 6px 4px;
        text-align: center;
        border-radius: 8px;
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text2);
      }
      .stage-chip .s { display:block; font-weight: 700; font-size: 14px; color: var(--text); margin-bottom: 2px; }
      .warn {
        background: #FFF8E7;
        border-left: 3px solid var(--accent);
        padding: 12px 16px;
        border-radius: 8px;
        font-size: 12px;
        color: #8A6A2F;
        line-height: 1.6;
      }
      .spacer { height: 20px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>IRONPULSE ADMIN</h1>
      <div class="sub">續用碼生成工具 · 離線可用</div>

      <div class="warn">
        <strong>⚠️ 注意：</strong>
        此頁面包含管理員密鑰，<strong>請勿公開分享此 HTML</strong>。
        僅在你自己的電腦上開啟使用。生成的續用碼可以安全地發給用戶。
      </div>

      <div class="spacer"></div>

      <div class="card">
        <label>管理員密鑰（Secret Key）</label>
        <input id="key" class="mono" type="text" placeholder="貼上你的 40+ 字元密鑰" autocomplete="off" />
        <div class="spacer"></div>
        <button class="secondary" id="btn-genkey">隨機生成一把新密鑰</button>
        <div class="muted" style="margin-top:8px">
          第一次使用請點「隨機生成」，然後把密鑰存在你自己的密碼管理員裡。
          之後每次打開此頁都要貼上同一把密鑰。
        </div>
      </div>

      <div class="card">
        <label>用戶裝置 ID（User's Device ID）</label>
        <input id="deviceId" class="mono" type="text" placeholder="用戶會在 App 的「設定→試用狀態」中看到" autocomplete="off" />
        <div class="muted" style="margin-top:8px">
          請用戶打開 App → 設定 → 試用狀態 → 複製裝置 ID
        </div>
        <div class="spacer"></div>

        <label>目標階段（Target Stage）</label>
        <select id="stage">
          <option value="1">Stage 1 · 7 天</option>
          <option value="2">Stage 2 · 14 天</option>
          <option value="3">Stage 3 · 30 天</option>
          <option value="4">Stage 4 · 永久</option>
        </select>

        <div class="stages">
          <div class="stage-chip"><span class="s">0</span>5天</div>
          <div class="stage-chip"><span class="s">1</span>7天</div>
          <div class="stage-chip"><span class="s">2</span>14天</div>
          <div class="stage-chip"><span class="s">3</span>30天</div>
          <div class="stage-chip"><span class="s">4</span>永久</div>
        </div>
      </div>

      <button id="btn-generate">生成續用碼</button>

      <div class="spacer"></div>

      <div id="resultWrap" class="card" style="display:none">
        <div class="result-label">✅ 續用碼（點擊複製）</div>
        <div id="result" class="result" title="點擊複製">—</div>
      </div>
    </div>

    <div id="toast" class="toast">已複製到剪貼簿</div>

    <script>
      // ======== HMAC-SHA256 實作 ========
      function strToBuf(str) {
        return new TextEncoder().encode(str);
      }
      function bufToBase64Url(buf) {
        const bytes = new Uint8Array(buf);
        let bin = '';
        for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      }
      async function hmacSign(secretKey, deviceId, stage) {
        const keyBuf = strToBuf(secretKey);
        const key = await crypto.subtle.importKey(
          'raw', keyBuf,
          { name: 'HMAC', hash: 'SHA-256' },
          false, ['sign']
        );
        const payload = `${deviceId}:${stage}`;
        const sig = await crypto.subtle.sign('HMAC', key, strToBuf(payload));
        const shortSig = sig.slice(0, 16);
        return bufToBase64Url(shortSig);
      }
      function formatCode(deviceId, stage, sig) {
        const shortDevice = deviceId.slice(0, 8).toUpperCase();
        return `IRON-${shortDevice}-${stage}-${sig}`;
      }
      function randomKey(len = 40) {
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
        const arr = new Uint8Array(len);
        crypto.getRandomValues(arr);
        let s = '';
        for (let i = 0; i < len; i++) s += chars[arr[i] % chars.length];
        return s;
      }
      function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 1500);
      }

      // ======== UI 事件 ========
      const $ = (id) => document.getElementById(id);
      $('btn-genkey').addEventListener('click', () => {
        const k = randomKey(48);
        $('key').value = k;
        showToast('已生成新密鑰，請記得保存');
      });
      $('btn-generate').addEventListener('click', async () => {
        const key = $('key').value.trim();
        const deviceId = $('deviceId').value.trim();
        const stage = parseInt($('stage').value, 10);
        if (!key) { showToast('請先輸入密鑰'); return; }
        if (key.length < 16) { showToast('密鑰至少 16 字元'); return; }
        if (!deviceId) { showToast('請輸入裝置 ID'); return; }

        try {
          const sig = await hmacSign(key, deviceId, stage);
          const code = formatCode(deviceId, stage, sig);
          $('result').textContent = code;
          $('resultWrap').style.display = 'block';
        } catch (e) {
          showToast('生成失敗：' + e.message);
        }
      });
      $('result').addEventListener('click', () => {
        const code = $('result').textContent;
        if (!code || code === '—') return;
        navigator.clipboard.writeText(code).then(
          () => showToast('續用碼已複製'),
          () => showToast('複製失敗，請手動選取')
        );
      });
    </script>
  </body>
</html>
