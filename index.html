<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <!--
      ⚠️ 雙主題圖標系統（G-05）：
      - 喺 React 載入前，先讀 localStorage['ironpulse-theme']（themeStore 手動 key）
      - 動態注入 manifest / apple-touch-icon / favicon 三個 <link>
      - 主題切換時由 themeStore 再次更新呢三個 link
      - iOS 已安裝 PWA 嘅主畫面圖標：需要刪除重裝先會更新（平台限制，屬預期）
    -->
    <script>
      (function () {
        try {
          var t = (typeof localStorage !== 'undefined' && localStorage.getItem('ironpulse-theme')) || 'light';
          if (t !== 'dark' && t !== 'light') t = 'light';
          var theme = t;
          var iconsBase = '/icons/vivix-icon-' + theme;
        } catch (e) {
          var theme = 'light';
          var iconsBase = '/icons/vivix-icon-light';
        }
        document.write(
          '<link id="vivix-manifest" rel="manifest" href="/manifest-' + theme + '.webmanifest" />' +
          '<link id="vivix-apple-touch" rel="apple-touch-icon" href="' + iconsBase + '-180.png" />' +
          '<link id="vivix-favicon" rel="icon" type="image/png" sizes="32x32" href="' + iconsBase + '-32.png" />'
        );
      })();
    </script>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- theme-color 初始先俾 light；themeStore 切換時會同步更新呢個 meta -->
    <meta id="vivix-theme-color" name="theme-color" content="#F8F5F0" />

    <!-- iOS PWA 標籤 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vivix" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="application-name" content="Vivix" />
    <meta name="description" content="Vivix - 給健身新手的陪伴型教練 App，完整力量訓練紀錄、進度追蹤與 Partner 陪伴系統。" />
    <meta property="og:title" content="Vivix - 你的新手訓練夥伴" />
    <meta property="og:site_name" content="Vivix" />
    <meta property="og:description" content="Vivix - 給健身新手的陪伴型教練 App" />

    <title>Vivix - 你的新手訓練夥伴</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Playfair+Display:wght@400;600;700;900&display=swap" rel="stylesheet" />

    <script type="module">
      if (import.meta.hot?.on) {
        import.meta.hot.on('vite:error', (error) => {
          if (error.err) {
            console.error(
              [error.err.message, error.err.frame].filter(Boolean).join('\n'),
            )
          }
        })
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
